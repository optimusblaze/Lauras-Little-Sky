<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Laura's Little Sky</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div id="background"></div>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <div
        class="intro"
        id="intro"
    >

        <h1>
            Laura's Little Sky
        </h1>

        <p>
            This is a little of what I can create!
        </p>

        <button
            class="start-button"
            id="startButton"
        >
            Begin
        </button>

    </div>


    <!-- =====================================================
         COUNTER
    ====================================================== -->

    <div
        class="counter"
        id="counter"
    >

        <span id="foundCount">0</span>

        /

        <span id="totalCount">30</span>

    </div>


    <!-- =====================================================
         MEMORY PANEL
    ====================================================== -->

    <div
        class="memory-panel"
        id="memoryPanel"
    >

        <div
            class="memory-text"
            id="memoryText"
        ></div>

        <button
            class="close-memory"
            id="closeMemory"
        >
            Back to the stars
        </button>

    </div>


    <!-- =====================================================
         HISTORICAL SKY
    ====================================================== -->

    <div
        class="historical-sky"
        id="historicalSky"
    >

        <canvas
            id="historicalSkyCanvas"
        ></canvas>


        <div class="historical-sky-content">

            <h2 id="historicalSkyTitle">
                The sky above us
            </h2>

            <div
                class="historical-sky-date"
                id="historicalSkyDate"
            ></div>

            <div
                class="historical-sky-status"
                id="historicalSkyStatus"
            >
                Looking back at the stars...
            </div>

            <button
                class="historical-sky-close"
                id="closeHistoricalSky"
            >
                Back to the memory
            </button>

        </div>

    </div>


    <!-- =====================================================
         SPECIAL SKY
         Kept available for future special memories.
    ====================================================== -->

    <div
        class="special-sky"
        id="specialSky"
    >

        <h2 id="specialTitle"></h2>

        <p id="specialText"></p>

        <button
            class="close-sky"
            id="closeSky"
        >
            Back to the sky
        </button>

    </div>


    <!-- =====================================================
         FINAL MESSAGE
    ====================================================== -->

    <div
        class="final-message"
        id="finalMessage"
    >

        <p>
            Apparently the stars needed
            your name too.
        </p>

        <p class="small">
            11 June 2026
        </p>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
